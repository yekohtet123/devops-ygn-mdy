name: YGN-MDY CI/CD with Automatic Rollback

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Build new candidate image
      # ==========================================
      - name: Build candidate image
        run: |
          docker build \
            -t mdy-app:${{ github.sha }} \
            ./mdy


      # ==========================================
      # 3. Remove old candidate container
      # ==========================================
      - name: Remove old candidate
        run: |
          docker rm -f mdy-candidate || true


      # ==========================================
      # 4. Run candidate on port 8083
      # ==========================================
      - name: Deploy candidate
        run: |
          docker run -d \
            --name mdy-candidate \
            -p 8083:80 \
            mdy-app:${{ github.sha }}


      # ==========================================
      # 5. Candidate health check
      #
      # If this fails, production is untouched.
      # ==========================================
      - name: Health check candidate
        run: |
          echo "Checking candidate..."

          for i in {1..10}; do

            if curl --fail --silent \
              http://127.0.0.1:8083/health.html \
              | grep -qx "healthy"; then

              echo "Candidate is HEALTHY"
              exit 0

            fi

            echo "Attempt $i failed..."
            sleep 2

          done

          echo "Candidate FAILED health check"

          docker logs mdy-candidate || true
          docker rm -f mdy-candidate || true

          exit 1


      # ==========================================
      # 6. Save current production for rollback
      #
      # production = current good image
      # rollback   = backup of current production
      # ==========================================
      - name: Save rollback image
        run: |
          echo "Saving current production image..."

          docker image inspect mdy-app:production > /dev/null

          docker tag \
            mdy-app:production \
            mdy-app:rollback

          echo "Rollback image saved."


      # ==========================================
      # 7. Remove current production container
      # ==========================================
      - name: Stop current production
        run: |
          docker rm -f mdy-app || true


      # ==========================================
      # 8. Deploy new version to production
      # ==========================================
      - name: Deploy new production
        run: |
          docker run -d \
            --name mdy-app \
            -p 8082:80 \
            mdy-app:${{ github.sha }}


      # ==========================================
      # 9. Verify new production
      #
      # Do NOT fail this step immediately.
      # Save result for rollback decision.
      # ==========================================
      - name: Verify new production
        id: production_check
        run: |
          echo "Checking new production..."

          HEALTHY=false

          for i in {1..10}; do

            if curl --fail --silent \
              http://127.0.0.1:8082/health.html \
              | grep -qx "healthy"; then

              HEALTHY=true
              break

            fi

            echo "Production check attempt $i failed..."
            sleep 2

          done

          if [ "$HEALTHY" = "true" ]; then

            echo "New production is HEALTHY"

            echo "healthy=true" >> "$GITHUB_OUTPUT"

          else

            echo "New production is UNHEALTHY"

            echo "healthy=false" >> "$GITHUB_OUTPUT"

          fi


      # ==========================================
      # 10. Rollback if new production failed
      # ==========================================
      - name: Automatic rollback
        if: steps.production_check.outputs.healthy != 'true'
        run: |
          echo "================================="
          echo "NEW PRODUCTION FAILED"
          echo "STARTING AUTOMATIC ROLLBACK"
          echo "================================="

          docker rm -f mdy-app || true

          docker run -d \
            --name mdy-app \
            -p 8082:80 \
            mdy-app:rollback

          echo "Waiting for rollback container..."
          sleep 2

          curl --fail \
            http://127.0.0.1:8082/health.html \
            | grep -qx "healthy"

          echo "ROLLBACK SUCCESSFUL"


      # ==========================================
      # 11. Fail pipeline after successful rollback
      #
      # Important:
      # Production is restored, but GitHub Actions
      # should still show that this release failed.
      # ==========================================
      - name: Mark deployment as failed
        if: steps.production_check.outputs.healthy != 'true'
        run: |
          echo "Deployment failed."
          echo "Previous production version was restored."
          exit 1


      # ==========================================
      # 12. Mark new image as production
      #
      # Only runs when new production is healthy.
      # ==========================================
      - name: Update production image tag
        if: steps.production_check.outputs.healthy == 'true'
        run: |
          docker tag \
            mdy-app:${{ github.sha }} \
            mdy-app:production

          echo "Production tag updated."


      # ==========================================
      # 13. Configure / reload Nginx
      # ==========================================
      - name: Switch Nginx to production
        if: steps.production_check.outputs.healthy == 'true'
        run: |
          cat > /tmp/devops-lab.conf <<'EOF'
          server {
              listen 8080;

              location / {
                  proxy_pass http://127.0.0.1:8082;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }
          EOF

          sudo -n /usr/bin/install \
            -m 644 \
            /tmp/devops-lab.conf \
            /etc/nginx/sites-available/devops-lab

          sudo -n /usr/sbin/nginx -t
          sudo -n /usr/bin/systemctl reload nginx


      # ==========================================
      # 14. Final production verification
      # ==========================================
      - name: Verify public production
        if: steps.production_check.outputs.healthy == 'true'
        run: |
          echo "Checking production through Nginx..."

          curl --fail http://127.0.0.1:8080

          echo ""
          echo "DEPLOYMENT SUCCESSFUL"


      # ==========================================
      # 15. Cleanup candidate
      # ==========================================
      - name: Cleanup candidate
        if: always()
        run: |
          docker rm -f mdy-candidate || true
