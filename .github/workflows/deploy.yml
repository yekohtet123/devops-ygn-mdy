name: YGN-MDY CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MDY Docker image
        run: |
          docker build -t mdy-app:v2 ./mdy

      - name: Remove old MDY container
        run: |
          docker rm -f mdy-app || true

      - name: Deploy MDY container
        run: |
          docker run -d \
            --name mdy-app \
            -p 8082:80 \
            mdy-app:v2

      - name: Health check MDY
        run: |
          echo "Checking MDY..."
          for i in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8082 > /dev/null; then
              echo "MDY is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "MDY health check failed"
          exit 1

      - name: Switch production to MDY
        run: |
          cat > /tmp/devops-lab.conf <<'EOF'
          server {
              listen 8080;

              location / {
                  proxy_pass http://127.0.0.1:8082;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }
          EOF

          sudo -n /usr/bin/install -m 644 \
            /tmp/devops-lab.conf \
            /etc/nginx/sites-available/devops-lab

          sudo -n /usr/sbin/nginx -t
          sudo -n /usr/bin/systemctl reload nginx

      - name: Verify production
        run: |
          curl --fail http://127.0.0.1:8080
